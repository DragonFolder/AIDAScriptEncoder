<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIDAScript</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <style>
    /* Teal accent, used instead of Bootstrap's blue */
    :root {
      --accent: #20c997;
      --accent-hover: #3dd5a7;
      --accent-active: #1aa179;
      --accent-rgb: 32, 201, 151;
    }

    .btn-primary {
      --bs-btn-color: #000;
      --bs-btn-bg: var(--accent);
      --bs-btn-border-color: var(--accent);
      --bs-btn-hover-color: #000;
      --bs-btn-hover-bg: var(--accent-hover);
      --bs-btn-hover-border-color: var(--accent-hover);
      --bs-btn-active-color: #000;
      --bs-btn-active-bg: var(--accent-active);
      --bs-btn-active-border-color: var(--accent-active);
      --bs-btn-focus-shadow-rgb: var(--accent-rgb);
    }
    .btn-outline-primary {
      --bs-btn-color: var(--accent);
      --bs-btn-border-color: var(--accent);
      --bs-btn-hover-color: #000;
      --bs-btn-hover-bg: var(--accent);
      --bs-btn-hover-border-color: var(--accent);
      --bs-btn-active-color: #000;
      --bs-btn-active-bg: var(--accent-active);
      --bs-btn-active-border-color: var(--accent-active);
      --bs-btn-focus-shadow-rgb: var(--accent-rgb);
    }
    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 .25rem rgba(var(--accent-rgb), .25);
    }

    .app-navbar { border-bottom: 2px solid var(--accent); }
    .app-navbar .navbar-brand { color: var(--accent); letter-spacing: .02em; }
    summary { cursor: pointer; }
    summary:hover { color: var(--accent) !important; }

    #input { font-family: var(--bs-font-monospace); resize: vertical; }
    #preview { min-height: 160px; }
    #preview svg { display: block; }
  </style>
</head>
<body class="bg-body">

  <nav class="navbar app-navbar bg-body-tertiary">
    <div class="container" style="max-width: 960px;">
      <span class="navbar-brand fw-semibold">AIDAScript</span>
    </div>
  </nav>

  <main class="container py-4" style="max-width: 960px;">

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <label for="input" class="form-label fw-semibold">Text</label>
        <textarea id="input" class="form-control" rows="4" placeholder="Type here..."></textarea>
        <div class="form-text">Each line becomes a column, read from top to bottom. Long lines wrap into new columns.</div>

        <details class="mt-3">
          <summary class="fw-semibold small text-body-secondary">Advanced settings</summary>

          <form id="settings" class="row g-3 mt-1" onsubmit="return false;">
            <div class="col-6 col-md-3">
              <label for="setPadding" class="form-label small">Padding (px)</label>
              <input id="setPadding" type="number" class="form-control form-control-sm" min="0" step="1" value="30">
            </div>
            <div class="col-6 col-md-3">
              <label for="setLineSize" class="form-label small">Line size (px)</label>
              <input id="setLineSize" type="number" class="form-control form-control-sm" min="1" step="1" value="20">
            </div>
            <div class="col-6 col-md-3">
              <label for="setLineSpacing" class="form-label small">Line spacing (px)</label>
              <input id="setLineSpacing" type="number" class="form-control form-control-sm" min="0" step="1" value="10">
            </div>
            <div class="col-6 col-md-3">
              <label for="setMaxHeight" class="form-label small">Maximum height (px)</label>
              <input id="setMaxHeight" type="number" class="form-control form-control-sm" min="1" step="10" value="400">
            </div>
            <div class="col-6 col-md-4">
              <label for="setLineColor" class="form-label small">Line color</label>
              <input id="setLineColor" type="color" class="form-control form-control-sm form-control-color w-100" value="#000000">
            </div>
            <div class="col-6 col-md-4">
              <label for="setBgColor" class="form-label small">Background color</label>
              <input id="setBgColor" type="color" class="form-control form-control-sm form-control-color w-100" value="#ffffff">
            </div>
            <div class="col-12 col-md-4 d-flex align-items-end">
              <button type="reset" class="btn btn-sm btn-outline-secondary w-100">Reset to defaults</button>
            </div>
            <div class="col-12 form-text mt-1">
              Line spacing is the extra gap between two columns.
              Maximum height is how far down a column may reach before the text wraps into a new column, not counting the padding.
            </div>
          </form>
        </details>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header d-flex flex-wrap align-items-center justify-content-between gap-2">
        <span class="fw-semibold">Preview</span>
        <div class="d-flex flex-wrap gap-2">
          <div class="btn-group btn-group-sm" role="group" aria-label="Zoom">
            <button id="zoomOut" type="button" class="btn btn-outline-secondary" aria-label="Zoom out">−</button>
            <button id="zoomReset" type="button" class="btn btn-outline-secondary" title="Reset zoom to 100%" style="min-width: 4rem;">100%</button>
            <button id="zoomIn" type="button" class="btn btn-outline-secondary" aria-label="Zoom in">+</button>
          </div>
          <div class="btn-group btn-group-sm" role="group" aria-label="Download">
            <button id="dlSvg" type="button" class="btn btn-outline-primary">Download SVG</button>
            <button id="dlPng" type="button" class="btn btn-primary">Download PNG</button>
          </div>
        </div>
      </div>
      <div class="card-body overflow-auto">
        <div id="preview"></div>
      </div>
    </div>

  </main>

  <script src="index.js"></script>
</body>
</html>
