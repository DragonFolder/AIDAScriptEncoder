<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIDAScript</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet" href="index.css">
</head>
<body class="bg-body">

  <nav class="navbar app-navbar bg-body-tertiary">
    <div class="container app-container">
      <span class="navbar-brand fw-semibold">AIDAScript</span>
    </div>
  </nav>

  <main class="container app-container py-4">
    <div class="row g-4">

      <!-- Left on large screens (above the preview on smaller ones): the text and settings -->
      <div class="col-xl-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <label for="input" class="form-label fw-semibold">Text</label>
            <textarea id="input" class="form-control" rows="4" placeholder="Type here..."></textarea>
            <div class="form-text">Each line becomes a column, read from top to bottom. Long lines wrap into new columns.</div>

            <details class="mt-3" open>
              <summary class="fw-semibold small text-body-secondary">Settings</summary>

              <form id="settings" class="mt-2" onsubmit="return false;">
                <!-- One group of settings at a time (see showSettingsTab in index.js) -->
                <ul class="nav nav-pills settings-tabs mb-3" role="tablist">
                  <li class="nav-item"><button type="button" class="nav-link active" data-tab="size" role="tab">Size</button></li>
                  <li class="nav-item"><button type="button" class="nav-link" data-tab="shape" role="tab">Shape</button></li>
                  <li class="nav-item"><button type="button" class="nav-link" data-tab="colors" role="tab">Colors</button></li>
                  <li class="nav-item" id="frameTab"><button type="button" class="nav-link" data-tab="frame" role="tab">Frame</button></li>
                </ul>

                <div class="row g-3" data-pane="size">
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setPadding" class="form-label small">Padding (px)</label>
                    <input id="setPadding" type="number" class="form-control form-control-sm" min="0" step="1" value="30">
                  </div>
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setLineSize" class="form-label small">Line size (px)</label>
                    <input id="setLineSize" type="number" class="form-control form-control-sm" min="1" step="1" value="20">
                  </div>
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setLineSpacing" class="form-label small">Line spacing (px)</label>
                    <input id="setLineSpacing" type="number" class="form-control form-control-sm" min="0" step="1" value="10">
                  </div>
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setMaxHeight" class="form-label small">Maximum height (px)</label>
                    <input id="setMaxHeight" type="number" class="form-control form-control-sm" min="1" step="10" value="400">
                  </div>
                </div>

                <div class="row g-3 d-none" data-pane="shape">
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setShape" class="form-label small">
                      Shape <span id="compactBadge" class="badge text-bg-warning ms-1" title="The compact shape is an experimental feature: results and speed may change" hidden>Experimental</span>
                    </label>
                    <select id="setShape" class="form-select form-select-sm">
                      <option value="rectangle" selected>Rectangle</option>
                      <option value="compact">Compact (experimental)</option>
                    </select>
                  </div>
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setGuideShape" class="form-label small">Guide shape</label>
                    <select id="setGuideShape" class="form-select form-select-sm">
                      <option value="circle" selected>Circle</option>
                      <option value="square">Square</option>
                    </select>
                  </div>
                  <div id="compactOptions" class="col-12 col-md-6 d-flex flex-column justify-content-end" data-setting>
                    <div class="form-check">
                      <input id="setExtendEnds" type="checkbox" class="form-check-input" checked>
                      <label for="setExtendEnds" class="form-check-label small">Extend free line ends</label>
                    </div>
                    <div class="form-check mb-1">
                      <input id="setShowGuide" type="checkbox" class="form-check-input">
                      <label for="setShowGuide" class="form-check-label small">Show line guides (preview only)</label>
                    </div>
                  </div>
                </div>

                <div class="row g-3 d-none" data-pane="colors">
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setLineColor" class="form-label small">Line color</label>
                    <input id="setLineColor" type="color" class="form-control form-control-sm form-control-color w-100" value="#000000">
                  </div>
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setColumnColours" class="form-label small">Column colors</label>
                    <select id="setColumnColours" class="form-select form-select-sm">
                      <option value="single" selected>One color</option>
                      <option value="alternate">Alternate two</option>
                    </select>
                  </div>
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setSecondColor" class="form-label small">Second line color</label>
                    <input id="setSecondColor" type="color" class="form-control form-control-sm form-control-color w-100" value="#1971c2">
                  </div>
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setBgColor" class="form-label small">Background color</label>
                    <input id="setBgColor" type="color" class="form-control form-control-sm form-control-color w-100" value="#ffffff">
                  </div>
                </div>

                <div class="row g-3 d-none" data-pane="frame">
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setFrame" class="form-label small">Frame</label>
                    <select id="setFrame" class="form-select form-select-sm">
                      <option value="none" selected>None</option>
                      <option value="guide">Guide shape</option>
                      <option value="rectangle">Smallest rectangle</option>
                      <option value="blob">Blob</option>
                    </select>
                  </div>
                  <div id="frameColorPanel" class="col-6 col-md-3" data-setting>
                    <label for="setFrameColor" class="form-label small">Frame color</label>
                    <input id="setFrameColor" type="color" class="form-control form-control-sm form-control-color w-100" value="#000000">
                    <div class="form-check mt-1">
                      <input id="setFrameSameColor" type="checkbox" class="form-check-input" checked>
                      <label for="setFrameSameColor" class="form-check-label small">Same as line color</label>
                    </div>
                  </div>
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setFrameWidth" class="form-label small">Frame thickness (px)</label>
                    <input id="setFrameWidth" type="number" class="form-control form-control-sm" min="1" step="1" value="5">
                  </div>
                </div>

                <button type="reset" class="btn btn-sm btn-outline-secondary w-100 mt-3">Reset to defaults</button>
              </form>
            </details>
          </div>
        </div>
      </div>

      <!-- Right on large screens (below on smaller ones): the preview -->
      <div class="col-xl-6">
        <div class="card shadow-sm preview-card">
          <div class="card-header d-flex flex-wrap align-items-center justify-content-between gap-2">
            <span class="fw-semibold">Preview</span>
            <div class="d-flex flex-wrap gap-2">
              <div id="layoutPicker" class="btn-group btn-group-sm" role="group" aria-label="Try another layout" hidden>
                <button id="layoutPrev" type="button" class="btn btn-outline-secondary" aria-label="Previous layout" title="Previous layout">‹</button>
                <span id="layoutLabel" class="btn btn-outline-secondary disabled layout-label">Layout 1 / 1</span>
                <button id="layoutNext" type="button" class="btn btn-outline-secondary" aria-label="Next layout" title="Try another layout">›</button>
              </div>
              <div class="btn-group btn-group-sm" role="group" aria-label="Zoom">
                <button id="zoomOut" type="button" class="btn btn-outline-secondary" aria-label="Zoom out">−</button>
                <button id="zoomReset" type="button" class="btn btn-outline-secondary" title="Reset zoom to 100%">100%</button>
                <button id="zoomIn" type="button" class="btn btn-outline-secondary" aria-label="Zoom in">+</button>
              </div>
              <div class="btn-group btn-group-sm" role="group" aria-label="Download">
                <button id="dlSvg" type="button" class="btn btn-outline-primary">Download SVG</button>
                <button id="dlPng" type="button" class="btn btn-primary">Download PNG</button>
              </div>
            </div>
          </div>
          <div class="card-body overflow-auto">
            <div id="preview"></div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
