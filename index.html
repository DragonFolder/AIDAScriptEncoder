<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIDAScript</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet" href="index.css">
</head>
<body class="bg-body">

  <nav class="navbar app-navbar bg-body-tertiary">
    <div class="container app-container">
      <span class="navbar-brand fw-semibold">AIDAScript</span>
    </div>
  </nav>

  <main class="container app-container py-4">
    <div class="row g-4">

      <!-- Left on large screens (above the preview on smaller ones): the text and settings -->
      <div class="col-xl-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <label for="input" class="form-label fw-semibold">Text</label>
            <textarea id="input" class="form-control" rows="4" placeholder="Type here..."></textarea>
            <div class="form-text">Each line becomes a column, read from top to bottom. Long lines wrap into new columns.</div>

            <details class="mt-3" open>
              <summary class="fw-semibold small text-body-secondary">Settings</summary>

              <form id="settings" class="mt-2" onsubmit="return false;">
                <!-- One group of settings at a time (see showSettingsTab in index.js) -->
                <ul class="nav nav-pills settings-tabs mb-3" role="tablist">
                  <li class="nav-item"><button type="button" class="nav-link active" data-tab="size" role="tab">Size</button></li>
                  <li class="nav-item"><button type="button" class="nav-link" data-tab="shape" role="tab">Shape</button></li>
                  <li class="nav-item"><button type="button" class="nav-link" data-tab="colors" role="tab">Colors</button></li>
                  <li class="nav-item" id="frameTab"><button type="button" class="nav-link" data-tab="frame" role="tab">Frame</button></li>
                </ul>

                <div class="row g-3" data-pane="size">
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setPadding" class="form-label small">Padding (px) <span class="tip" tabindex="0" role="button" aria-label="About Padding: Empty space around the drawing." data-tip="Empty space around the drawing.">?</span></label>
                    <input id="setPadding" type="number" class="form-control form-control-sm" min="0" step="1" value="30">
                  </div>
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setLineSize" class="form-label small">Line size (px) <span class="tip" tabindex="0" role="button" aria-label="About Line size: Length of one stroke. Scales everything." data-tip="Length of one stroke. Scales everything.">?</span></label>
                    <input id="setLineSize" type="number" class="form-control form-control-sm" min="1" step="1" value="20">
                  </div>
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setLineSpacing" class="form-label small">Line spacing (px) <span class="tip" tabindex="0" role="button" aria-label="About Line spacing: Extra gap between columns." data-tip="Extra gap between columns.">?</span></label>
                    <input id="setLineSpacing" type="number" class="form-control form-control-sm" min="0" step="1" value="10">
                  </div>
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setMaxHeight" class="form-label small">Maximum height (px) <span class="tip" tabindex="0" role="button" aria-label="About Maximum height: How tall a column gets before wrapping." data-tip="How tall a column gets before wrapping.">?</span></label>
                    <input id="setMaxHeight" type="number" class="form-control form-control-sm" min="1" step="10" value="400">
                  </div>
                </div>

                <div class="row g-3 d-none" data-pane="shape">
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setShape" class="form-label small">
                      Shape <span id="compactBadge" class="badge text-bg-warning ms-1" title="The compact shape is an experimental feature: results and speed may change" hidden>Experimental</span> <span class="tip" tabindex="0" role="button" aria-label="About Shape: Rectangle: plain columns. Compact: a tight, overlapping blob." data-tip="Rectangle: plain columns. Compact: a tight, overlapping blob.">?</span>
                    </label>
                    <select id="setShape" class="form-select form-select-sm">
                      <option value="rectangle" selected>Rectangle</option>
                      <option value="compact">Compact (experimental)</option>
                    </select>
                  </div>
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setGuideShape" class="form-label small">Guide shape <span class="tip" tabindex="0" role="button" aria-label="About Guide shape: The outline the text aims to fill." data-tip="The outline the text aims to fill.">?</span></label>
                    <select id="setGuideShape" class="form-select form-select-sm">
                      <option value="circle" selected>Circle</option>
                      <option value="rectangle">Rectangle</option>
                      <option value="hexagon">Hexagon</option>
                      <option value="diamond">Diamond</option>
                      <option value="triangle">Triangle</option>
                    </select>
                  </div>
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setGuideRatio" class="form-label small">Width : height <span id="guideRatioValue" class="text-body-secondary"></span> <span class="tip" tabindex="0" role="button" aria-label="About Width : height: Stretches the guide shape wider or taller." data-tip="Stretches the guide shape wider or taller.">?</span></label>
                    <input id="setGuideRatio" type="range" class="form-range" min="0.5" max="2.5" step="0.1" value="1">
                  </div>
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setGuideRotation" class="form-label small">Rotation <span id="guideRotationValue" class="text-body-secondary"></span> <span class="tip" tabindex="0" role="button" aria-label="About Rotation: Turns the guide shape." data-tip="Turns the guide shape.">?</span></label>
                    <input id="setGuideRotation" type="range" class="form-range" min="0" max="180" step="5" value="0">
                  </div>
                  <div class="col-12 col-md-6" data-setting>
                    <label for="setGuideFit" class="form-label small">Fit to guide <span id="guideFitValue" class="text-body-secondary"></span> <span class="tip" tabindex="0" role="button" aria-label="About Fit to guide: Trade some tightness for filling out the guide shape." data-tip="Trade some tightness for filling out the guide shape.">?</span></label>
                    <input id="setGuideFit" type="range" class="form-range" min="0" max="100" step="10" value="0">
                    <div class="d-flex justify-content-between small text-body-secondary range-ends"><span>Tightest</span><span>Guide shape</span></div>
                  </div>
                  <div id="compactOptions" class="col-12 col-md-6 d-flex flex-column justify-content-end" data-setting>
                    <div class="form-check">
                      <input id="setExtendEnds" type="checkbox" class="form-check-input" checked>
                      <label for="setExtendEnds" class="form-check-label small">Extend free line ends <span class="tip" tabindex="0" role="button" aria-label="About Extend free line ends: Lengthens loose stroke tips by half a line." data-tip="Lengthens loose stroke tips by half a line.">?</span></label>
                    </div>
                    <div class="form-check mb-1">
                      <input id="setShowGuide" type="checkbox" class="form-check-input">
                      <label for="setShowGuide" class="form-check-label small">Show line guides (preview only) <span class="tip" tabindex="0" role="button" aria-label="About Show line guides: Traces each column. Not downloaded." data-tip="Traces each column. Not downloaded.">?</span></label>
                    </div>
                  </div>
                </div>

                <div class="row g-3 d-none" data-pane="colors">
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setLineColor" class="form-label small">Line color <span class="tip" tabindex="0" role="button" aria-label="About Line color: Color of the strokes." data-tip="Color of the strokes.">?</span></label>
                    <input id="setLineColor" type="color" class="form-control form-control-sm form-control-color w-100" value="#000000">
                  </div>
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setColumnColours" class="form-label small">Column colors <span class="tip" tabindex="0" role="button" aria-label="About Column colors: Gives neighbouring columns different colors." data-tip="Gives neighbouring columns different colors.">?</span></label>
                    <select id="setColumnColours" class="form-select form-select-sm">
                      <option value="single" selected>One color</option>
                      <option value="alternate">Alternate two</option>
                    </select>
                  </div>
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setSecondColor" class="form-label small">Second line color <span class="tip" tabindex="0" role="button" aria-label="About Second line color: Used by &quot;Alternate two&quot;." data-tip="Used by &quot;Alternate two&quot;.">?</span></label>
                    <input id="setSecondColor" type="color" class="form-control form-control-sm form-control-color w-100" value="#1971c2">
                  </div>
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setBgColor" class="form-label small">Background color <span class="tip" tabindex="0" role="button" aria-label="About Background color: Color behind the drawing." data-tip="Color behind the drawing.">?</span></label>
                    <input id="setBgColor" type="color" class="form-control form-control-sm form-control-color w-100" value="#ffffff">
                    <div class="form-check mt-1">
                      <input id="setTransparent" type="checkbox" class="form-check-input">
                      <label for="setTransparent" class="form-check-label small">Transparent <span class="tip" tabindex="0" role="button" aria-label="About Transparent: No background in downloads." data-tip="No background in downloads.">?</span></label>
                    </div>
                  </div>
                  <div class="col-12">
                    <button id="randomColors" type="button" class="btn btn-sm btn-outline-primary">🎲 Random colors</button>
                    <span class="tip" tabindex="0" role="button" aria-label="About Random colors: Picks line, frame and background colors that match." data-tip="Picks line, frame and background colors that match.">?</span>
                    <span id="randomColorsName" class="small text-body-secondary ms-2" aria-live="polite"></span>
                  </div>
                </div>

                <div class="row g-3 d-none" data-pane="frame">
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setFrame" class="form-label small">Frame <span class="tip" tabindex="0" role="button" aria-label="About Frame: A border around the result. Never changes the layout." data-tip="A border around the result. Never changes the layout.">?</span></label>
                    <select id="setFrame" class="form-select form-select-sm">
                      <option value="none" selected>None</option>
                      <option value="guide">Guide shape</option>
                      <option value="rectangle">Smallest rectangle</option>
                      <option value="blob">Blob</option>
                    </select>
                  </div>
                  <div id="frameColorPanel" class="col-6 col-md-3" data-setting>
                    <label for="setFrameColor" class="form-label small">Frame color <span class="tip" tabindex="0" role="button" aria-label="About Frame color: Color of the frame." data-tip="Color of the frame.">?</span></label>
                    <input id="setFrameColor" type="color" class="form-control form-control-sm form-control-color w-100" value="#000000">
                    <div class="form-check mt-1">
                      <input id="setFrameSameColor" type="checkbox" class="form-check-input" checked>
                      <label for="setFrameSameColor" class="form-check-label small">Same as line color</label>
                    </div>
                  </div>
                  <div class="col-6 col-md-3" data-setting>
                    <label for="setFrameWidth" class="form-label small">Frame thickness (px) <span class="tip" tabindex="0" role="button" aria-label="About Frame thickness: How thick the frame is." data-tip="How thick the frame is.">?</span></label>
                    <input id="setFrameWidth" type="number" class="form-control form-control-sm" min="1" step="1" value="5">
                  </div>
                </div>

                <button type="reset" class="btn btn-sm btn-outline-secondary w-100 mt-3">Reset to defaults</button>
              </form>
            </details>
          </div>
        </div>
      </div>

      <!-- Right on large screens (below on smaller ones): the preview -->
      <div class="col-xl-6">
        <div class="card shadow-sm preview-card">
          <div class="card-header d-flex flex-wrap align-items-center justify-content-between gap-2">
            <div class="d-flex flex-wrap align-items-center gap-2">
              <span class="fw-semibold">Preview</span>
              <!-- The same choice as Settings → Shape, kept in step with it (see readSettings) -->
              <div class="btn-group btn-group-sm" role="group" aria-label="Shape">
                <input type="radio" class="btn-check" name="quickShape" id="quickRectangle" value="rectangle" autocomplete="off">
                <label class="btn btn-outline-primary" for="quickRectangle">Rectangle</label>
                <input type="radio" class="btn-check" name="quickShape" id="quickCompact" value="compact" autocomplete="off">
                <label class="btn btn-outline-primary" for="quickCompact">Compact ✨</label>
              </div>
              <button id="surpriseMe" type="button" class="btn btn-sm btn-outline-primary text-nowrap" title="A random compact look: shape, frame and colors">🎲 Surprise me</button>
              <span id="layoutBusy" class="small text-body-secondary" role="status" hidden>Arranging…</span>
            </div>
            <div class="d-flex flex-wrap gap-2">
              <div id="layoutPicker" class="btn-group btn-group-sm" role="group" aria-label="Try another layout" hidden>
                <button id="layoutPrev" type="button" class="btn btn-outline-secondary" aria-label="Previous layout" title="Previous layout">‹</button>
                <span id="layoutLabel" class="btn btn-outline-secondary disabled layout-label">Layout 1 / 1</span>
                <button id="layoutNext" type="button" class="btn btn-outline-secondary" aria-label="Next layout" title="Try another layout">›</button>
              </div>
              <div class="btn-group btn-group-sm" role="group" aria-label="Zoom">
                <button id="zoomOut" type="button" class="btn btn-outline-secondary" aria-label="Zoom out">−</button>
                <button id="zoomReset" type="button" class="btn btn-outline-secondary" title="Reset zoom to 100%">100%</button>
                <button id="zoomIn" type="button" class="btn btn-outline-secondary" aria-label="Zoom in">+</button>
              </div>
              <div class="btn-group btn-group-sm" role="group" aria-label="Download">
                <button id="dlSvg" type="button" class="btn btn-outline-primary">Download SVG</button>
                <button id="dlPng" type="button" class="btn btn-primary">Download PNG</button>
              </div>
            </div>
          </div>
          <div class="card-body overflow-auto">
            <div id="preview"></div>
          </div>
          <!-- A nudge towards the compact shape, until it's been tried or closed (see showCompactHint) -->
          <div id="compactHint" class="card-footer compact-hint small d-flex align-items-center gap-2 d-none">
            <span>✨ Try the <strong>Compact</strong> shape: the same text, packed into a shape you choose.</span>
            <button id="compactHintTry" type="button" class="btn btn-sm btn-primary ms-auto text-nowrap">Try it</button>
            <button id="compactHintClose" type="button" class="btn-close" aria-label="Don't show this again" title="Don't show this again"></button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="layout.js"></script>
  <script src="colors.js"></script>
  <script src="index.js"></script>
</body>
</html>
